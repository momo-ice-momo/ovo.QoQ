<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>角色狀態欄工坊 · HUD Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--pg:#f3efe9;--pn:#fffdfa;--ink:#2b2a33;--mut:#7a7684;--line:#e4ddd2;--acc:#6b5bd6;--acc2:#e08fb0;--sh:0 10px 40px rgba(60,40,90,.08);

html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#121118;--pn:#1b1a24;--ink:#ece9f5;--mut:#9b97ab;--line:#2d2b3a;--acc:#a898ff;--acc2:#f2a1c4;--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--pg:#121118;--pn:#1b1a24;--ink:#ece9f5;--mut:#9b97ab;--line:#2d2b3a;--acc:#a898ff;--acc2:#f2a1c4;--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,sans-serif;
background-image:radial-gradient(60rem 30rem at 85% -10%,color-mix(in srgb,var(--acc) 18%,transparent),transparent),radial-gradient(40rem 24rem at -5% 10%,color-mix(in srgb,var(--acc2) 14%,transparent),transparent);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 40%,transparent)}
h1{font:700 24px "Noto Serif TC",serif;margin:0;letter-spacing:.04em}
header p{margin:0;color:var(--mut);font-size:13px}
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.steps button{flex:1;min-width:92px;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:var(--pn);color:var(--mut);border-radius:14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.steps b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--ink)}
.steps .on{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.steps .on b,.steps .done b{background:var(--acc);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:22px;align-items:start}
.panel{background:var(--pn);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--sh)}
.panel h2{font:700 20px "Noto Serif TC",serif;margin:0 0 4px}
.hint{color:var(--mut);margin:0 0 18px;font-size:13.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;font:inherit;cursor:pointer;text-align:left;transition:.2s}
.opt svg{color:var(--acc);margin-bottom:4px}.opt small{color:var(--mut);font-size:11.5px;line-height:1.35}
.opt:hover{transform:translateY(-2px);border-color:var(--acc)}.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:12px}
input[type=text],input[type=number],textarea{width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--pg);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 50%,transparent);border-color:var(--acc)}
.lbl{font-size:12.5px;color:var(--mut);margin:6px 0}
select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--pg);color:var(--ink);font:inherit}
.rp{position:absolute;width:12px;height:12px;margin:-6px;border:2px solid var(--acc);border-radius:50%;pointer-events:none;animation:rip .7s ease-out forwards}@keyframes rip{to{transform:scale(14);opacity:0}}
.icons{display:flex;gap:8px;flex-wrap:wrap}
.ic{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:11px;margin:0}
.ic.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.th{border:2px solid transparent;border-radius:14px;padding:12px 10px 10px;cursor:pointer;text-align:left;font:inherit;transition:.2s}
.th:hover{transform:translateY(-2px)}.th.on{border-color:var(--acc)}
.th i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:4px;vertical-align:middle}
.th b{display:block;margin-top:8px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=color]{width:100%;height:38px;margin-top:4px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--pg);cursor:pointer}
.frow{display:grid;grid-template-columns:34px 1fr 1.2fr 28px;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.frow input[type=text],.frow input[type=number]{margin:0;padding:6px 9px}
.frow .ct{display:flex;align-items:center;gap:8px;min-width:0}.frow .ct input[type=range]{flex:1;min-width:0}.frow em{font-style:normal;font-size:11.5px;color:var(--mut);min-width:44px;text-align:right}
.tag{font-size:11px;text-align:center;padding:3px 0;border-radius:8px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:700}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px}.x:hover{color:#e5484d}
input[type=range]{accent-color:var(--acc)}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.btn{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.pri:hover{color:#fff;filter:brightness(1.06)}
.nav{display:flex;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips .btn.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;margin:12px 0;color:var(--ink)}
textarea{height:300px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.pvbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.stage{position:relative;border-radius:22px;padding:76px 14px 34px;border:1px solid var(--line);background-color:var(--pn);background-image:radial-gradient(color-mix(in srgb,var(--mut) 30%,transparent) 1px,transparent 1px);background-size:16px 16px;box-shadow:var(--sh);cursor:pointer;overflow:hidden}
.stage>span{position:absolute;top:10px;left:16px;font-size:11px;letter-spacing:.12em;color:var(--mut)}
.sbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.sbtn .btn{padding:6px 14px;font-size:12.5px}.sbtn .btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fx{position:absolute;pointer-events:none;font-size:18px;animation:pop .9s cubic-bezier(.1,.8,.3,1) forwards;z-index:9}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,40px);background:var(--ink);color:var(--pg);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:960px){.main{grid-template-columns:1fr}.pvbox{position:static;order:-1}.grid3,.themes{grid-template-columns:repeat(2,1fr)}.frow{grid-template-columns:30px 1fr 24px}.frow .ct{grid-column:1/-1}}
</style>
</head>

<div class="wrap">
<header>
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h6M7 13h10M7 16.5h4"/><circle cx="17" cy="9" r="1.2" fill="currentColor"/></svg></div>

</div>

 if(S.ex==='html')return`<!-- 角色狀態欄：${S.name} -->\n<style>\n${CARD_CSS}\n</style>\n${cardHTML()}`;
 if(S.ex==='json')return JSON.stringify({...S,px:{...S.px,src:''},av:S.av.t==='img'?{t:'img',src:'(已省略)'}:S.av,step:undefined},null,2);
 const ln=S.f.map(f=>f.t==='sec'?`\n【${f.n}】`:f.t==='bar'?`- ${f.n}：[數值]/${f.max}`:f.t==='heart'?`- ${f.n}：[0-${f.max}] 顆愛心`:f.t==='num'?`- ${f.n}：[數字]`:`- ${f.n}：[簡短描述]`).join('\n');
 const rl=S.states.slice(1).map(s=>{const f=S.f.find(x=>x.id==s.fid);return f?`- ${f.n} ${s.op} ${s.v}${f.t==='bar'?'%':''} 時，當前狀態改為「${s.lb}」`:''}).filter(Boolean).join('\n');
 return`【狀態欄規則】\n每次回覆結尾，請依劇情更新 {{char}}（${S.name}，${S.title}）的狀態欄，並嚴格維持以下格式：\n\n━━━━━━━━━━━━━━\n${S.name}｜${S.title}\n當前狀態：[${S.states.map(s=>s.lb).join(' / ')}]${ln}\n━━━━━━━━━━━━━━\n\n規則：\n1. 數值依互動合理增減，單次變化不超過 15%。\n2. 狀態切換條件：\n${rl||'- 依劇情自行判斷'}\n3. 狀態欄只放在回覆最後，不要在劇情中重複。`}
$('#stage').addEventListener('click',e=>{const row=e.target.closest('.row[data-f]');if(S.bump&&row){const f=S.f.find(x=>x.id==row.dataset.f);if(f){f.v=f.v+f.max/10>f.max?0:Math.round(f.v+f.max/10);pv();if(ORD[S.step]===4)panel();return}}
 if(S.click==='cycle'){S.cur=S.cur<0?0:(S.cur+1)%S.states.length;pv()}
 if(S.click==='ripple'){const r=e.currentTarget.getBoundingClientRect(),p=document.createElement('span');p.className='rp';p.style.left=e.clientX-r.left+'px';p.style.top=e.clientY-r.top+'px';e.currentTarget.appendChild(p);setTimeout(()=>p.remove(),700)}});
$('#stage').addEventListener('mousemove',e=>{const h=$('#pv .hud');if(!h)return;const r=h.getBoundingClientRect();h.style.setProperty('--mx',e.clientX-r.left+'px');h.style.setProperty('--my',e.clientY-r.top+'px')});
function tiltReset(){const w=$('#pv .hw');if(w)w.style.transform=''}
$('#stage').addEventListener('mousemove',e=>{if(!S.tilt)return;const w=$('#pv .hw');if(!w)return;const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;w.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg)`});
$('#stage').addEventListener('mouseleave',tiltReset);
panel();pv();
</script>
</body>
</html>
